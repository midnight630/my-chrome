<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>识趣图片</title>
</head>

<body>
  <noscript>您需要启用 JavaScript 才能运行该扩展程序。</noscript>
  <main id="root" class="sidebar_app">
    <!-- <header class="sidebar_header">
      <h1>识趣图片</h1>
    </header> -->

    <section class="toolbar" aria-label="图片查找操作">
      <button class="tool_button" type="button" data-action="scan">
        查找图片
      </button>
      <button class="tool_button" type="button" data-action="pick">
        指点图片
      </button>
      <button id="recognition_toggle" class="tool_button danger_button" type="button" data-action="toggle-recognition">
        关闭识别
      </button>
    </section>

    <section id="status_text" class="status_bar" aria-live="polite">准备查找评论区图片</section>

    <section class="selection_bar">
      <span id="selection_count">0 / 0 已选择</span>
      <div>
        <button id="select_all_button" type="button" data-action="select-all">全选</button>
        <button type="button" data-action="clear">清空</button>
      </div>
    </section>

    <section id="image_list" class="image_list" aria-label="图片结果">
      <div class="empty_state">
        点击“查找图片”扫描当前页面，或点击“指点图片”后到页面上点选图片区域。
      </div>
    </section>

    <footer class="download_bar">
      <button class="secondary_button" type="button" data-action="scroll-top">
        滚动到顶部
      </button>
      <button class="download_button" type="button" data-action="download">
        下载选中
      </button>
    </footer>
  </main>
  <div id="image_preview" class="image_preview" hidden>
    <div class="image_preview_backdrop" data-action="close-preview"></div>
    <div class="image_preview_panel" role="dialog" aria-modal="true" aria-label="图片预览">
      <button class="image_preview_close" type="button" data-action="close-preview" aria-label="关闭预览">×</button>
      <div class="image_preview_toolbar">
        <span id="image_preview_counter" class="image_preview_counter"></span>
        <button type="button" data-action="download-preview">下载当前</button>
      </div>
      <button class="image_preview_nav image_preview_prev" type="button" data-action="previous-preview" aria-label="上一张">‹</button>
      <img id="image_preview_img" alt="" />
      <button class="image_preview_nav image_preview_next" type="button" data-action="next-preview" aria-label="下一张">›</button>
      <div id="image_preview_caption" class="image_preview_caption"></div>
    </div>
  </div>
  <script src="./scripts.js"></script>
</body>

</html>
